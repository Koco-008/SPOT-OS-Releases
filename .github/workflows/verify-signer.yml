name: Verify public OS signer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  signer-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate Python and workflow YAML without secrets
        run: |
          python -m py_compile signer/sign_candidate.py
          python -m pip install 'PyYAML==6.0.2'
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in Path('.github/workflows').glob('*.yml'):
              v=yaml.safe_load(path.read_text())
              assert isinstance(v,dict) and isinstance(v.get('jobs'),dict), path
              print('Valid',path)
          PY
      - name: Provenance and tampering regression tests (mock GitHub, no secrets)
        run: python -m unittest discover -s signer -p "test_*.py" -v
      - name: Security invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          script=Path('signer/sign_candidate.py').read_text()
          workflow=Path('.github/workflows/release-os.yml').read_text()
          assert 'SOURCE_REPO_ID = 1420310429' in script
          assert 'SOURCE = "Koco-008/SPOT"' in script
          assert 'private.sign(raw)' in script
          assert 'environment: spot-os-release' in workflow
          assert 'source_commit' in workflow
          assert 'workflow_dispatch' in workflow
          assert 'pull_request_target' not in workflow
          assert 'inputs.tag' in workflow
          print('Signer invariants OK (not a substitute for security review)')
          PY
