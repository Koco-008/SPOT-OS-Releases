name: Protected SPOT OS signing
on:
  workflow_dispatch:
    inputs:
      source_commit: {type: string, required: true}
      tag: {type: string, required: true}
      sequence: {type: number, required: true}
      previous_os: {type: string, required: true}
      channel: {type: choice, options: [prerelease], default: prerelease}
permissions:
  contents: read
jobs:
  sign-and-publish:
    if: github.repository == 'Koco-008/SPOT-OS-Releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: spot-os-release
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: protected-spot-os-signing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install trusted signer dependency
        run: python -m pip install 'cryptography==44.0.3'
      - name: Validate approved private CI artifact; sign verified OS only
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_COMMIT: ${{ vars.SPOT_OS_APPROVED_COMMIT }}
          SIGNING_ENABLED: ${{ vars.SPOT_OS_SIGNING_ENABLED }}
          PUBLIC_KEY_SHA256: ${{ vars.SPOT_OS_PUBLIC_KEY_SHA256 }}
          SOURCE_ACTIONS_TOKEN: ${{ secrets.SPOT_OS_SOURCE_ACTIONS_TOKEN }}
          OS_SIGNING_KEY: ${{ secrets.SPOT_OS_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SEQUENCE: ${{ inputs.sequence }}
          PREVIOUS_OS: ${{ inputs.previous_os }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python signer/sign_candidate.py
      - name: Ensure tag/release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release exists"; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "Tag exists"; exit 1; fi
      - name: Publish the four verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          gh release create "$TAG" out/spot-os-0.1.4.zip out/os-update.json out/os-update.json.sig out/SHA256SUMS.txt --prerelease --draft --target "$GITHUB_SHA" --title 'SPOT OS 0.1.4 hardware candidate' --notes "Reviewed private source commit: $SOURCE_COMMIT"
          gh release edit "$TAG" --draft=false
          mkdir published
          gh release download "$TAG" --dir published
          test "$(find published -maxdepth 1 -type f | wc -l)" -eq 4
          for file in spot-os-0.1.4.zip os-update.json os-update.json.sig SHA256SUMS.txt; do cmp "out/$file" "published/$file"; done
          ( cd published && sha256sum --check SHA256SUMS.txt )
